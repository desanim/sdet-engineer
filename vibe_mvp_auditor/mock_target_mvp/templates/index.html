<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Valid Mobile Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeResume AI - Build 10x Resumes with AI</title>

  <!-- OpenGraph Social Cards -->
  <meta property="og:title" content="VibeResume AI - Build 10x Resumes with AI">
  <meta property="og:description" content="The #1 Vibe-Coded Resume Builder on Product Hunt. Land your dream SDET job.">
  <meta property="og:image" content="https://viberesume.ai/og-preview.png">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .hero {
      padding: 60px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2.8rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    p {
      color: #94a3b8;
      font-size: 1.2rem;
      margin-bottom: 32px;
    }
    .cta-button {
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      min-height: 48px;
    }
    .cta-button:hover {
      background: #4f46e5;
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      padding: 40px 20px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 260px;
      border: 1px solid #334155;
    }
    /* Intentional Defect: Broken Image */
    .broken-image-test {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>VibeResume AI</h1>
    <p>Generate ATS-optimized resumes in 60 seconds with cutting-edge AI prompts.</p>
    <button id="cta-generate-btn" class="cta-button">Generate Resume Now</button>
  </div>

  <div class="features">
    <div class="card">
      <h3>🚀 1-Click Export</h3>
      <p>Instant PDF download ready for recruiter screening.</p>
      <!-- Intentional Defect for Crawler: Broken image link -->
      <img src="/static/non-existent-sample.png" alt="Sample ATS Resume" class="broken-image-test">
    </div>
    <div class="card">
      <h3>⚡ ATS Scoring</h3>
      <p>Scans keywords against Fortune 500 job descriptions.</p>
    </div>
  </div>

  <!-- Linked Client Script -->
  <script src="/static/bundle.js"></script>
</body>
</html>
