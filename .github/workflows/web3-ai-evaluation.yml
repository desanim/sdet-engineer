name: Web3 AI evaluation lab
on:
  push:
    paths: ['web3-ai-security-lab/**', '.github/workflows/web3-ai-evaluation.yml']
  pull_request:
    paths: ['web3-ai-security-lab/**', '.github/workflows/web3-ai-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test oracle, security boundary and CLI
        working-directory: web3-ai-security-lab
        run: python -m unittest discover -s tests -v
      - name: Evaluate reference target
        run: python web3-ai-security-lab/run_eval.py
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.python-version }}
          path: web3-ai-security-lab/reports/
          if-no-files-found: warn
